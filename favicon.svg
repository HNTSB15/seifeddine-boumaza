<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9c"/>
      <stop offset="50%" stop-color="#12d6ff"/>
      <stop offset="100%" stop-color="#2f63c0"/>
    </linearGradient>
    <linearGradient id="t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00ff9c"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#080f1d" stroke="url(#g)" stroke-width="2.5"/>
  <!-- Chart Candlestick (Right) -->
  <line x1="50" y1="12" x2="50" y2="40" stroke="#00ff9c" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="47.5" y="17" width="5" height="15" rx="1" fill="#00ff9c"/>
  <!-- Rising Breakout Trendline -->
  <path d="M8 46 L20 35 L30 40 L50 16" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 16 H50 V24" fill="none" stroke="#00ff9c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Peak Signal Pulse -->
  <circle cx="50" cy="16" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="16" r="1.8" fill="#00ff9c"/>
  <!-- Monogram SB -->
  <text x="26" y="40" font-family="'JetBrains Mono', 'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="900" fill="url(#t)" letter-spacing="-1.5" text-anchor="middle">SB</text>
</svg>

