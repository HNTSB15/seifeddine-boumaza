<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://cryptologos.cc/logos/tether-usdt-logo.png">
    <title>إنشاء حساب احترافي - Flash USDT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #0b0e11;
            color: #eaecef;
            font-family: 'Segoe UI', sans-serif;
        }

        .input-style {
            background: #161a1e;
            border: 1px solid #333;
            color: white;
            transition: 0.3s;
        }

        .input-style:focus {
            border-color: #26A17B;
            outline: none;
            box-shadow: 0 0 10px rgba(38, 161, 123, 0.2);
        }

        /* تنسيق قائمة اللغة العائمة */

        .lang-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        [dir="ltr"] .lang-container {
            left: auto;
            right: 20px;
        }

        .lang-dropdown-menu {
            left: 0;
        }

        [dir="ltr"] .lang-dropdown-menu {
            left: auto;
            right: 0;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-6 relative">

    <!-- زر تبديل اللغة الاحترافي -->
    <div class="lang-container">
        <div class="relative inline-block text-left">
            <button onclick="toggleLangMenu()" class="flex items-center justify-center w-10 h-10 rounded-full bg-[#1e2329] border border-gray-700 text-gray-400 hover:text-white hover:border-[#26A17B] transition shadow-lg focus:outline-none">
                <i class="fas fa-globe text-lg"></i>
            </button>

            <div id="langDropdown" class="hidden absolute mt-2 w-32 rounded-xl shadow-lg bg-[#1e2329] border border-gray-700 ring-1 ring-black ring-opacity-5 focus:outline-none lang-dropdown-menu">
                <div class="py-2">
                    <button onclick="setLanguage('ar')" class="text-gray-300 hover:bg-[#2b3139] hover:text-[#26A17B] flex items-center justify-between w-full px-4 py-2 text-sm transition">
                        العربية <span>🇸🇦</span>
                    </button>
                    <button onclick="setLanguage('en')" class="text-gray-300 hover:bg-[#2b3139] hover:text-[#26A17B] flex items-center justify-between w-full px-4 py-2 text-sm transition">
                        English <span>🇺🇸</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- نموذج إنشاء الحساب -->
    <div class="bg-[#1e2329] p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl relative z-10">
        <div class="text-center mb-6">
            <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" width="50" class="mx-auto mb-4">
            <h2 class="text-2xl font-bold text-[#26A17B]" data-i18n="mainHeading">إنشاء حساب جديد</h2>
            <p class="text-gray-500 text-sm mt-2" data-i18n="subHeading">انضم لأكبر منصة لتداول الفلاش USDT</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <input type="text" id="fname" data-i18n-placeholder="fnamePh" placeholder="الاسم الأول" class="input-style p-3 rounded-lg w-full">
            <input type="text" id="lname" data-i18n-placeholder="lnamePh" placeholder="اللقب" class="input-style p-3 rounded-lg w-full">
        </div>
        <input type="text" id="user" data-i18n-placeholder="userPh" placeholder="اسم المستخدم" class="input-style p-3 rounded-lg w-full mb-4">
        <input type="email" id="email" data-i18n-placeholder="emailPh" placeholder="البريد الإلكتروني" class="input-style p-3 rounded-lg w-full mb-4">
        <input type="password" id="pass" data-i18n-placeholder="passPh" placeholder="كلمة المرور" class="input-style p-3 rounded-lg w-full mb-4">

        <div class="relative mb-6">
            <input type="text" id="refInput" data-i18n-placeholder="refPh" placeholder="كود الإحالة (اختياري)" class="input-style p-3 rounded-lg w-full pr-10 pl-10 border-dashed border-gray-600 text-center" dir="auto">
            <i class="fas fa-gift absolute right-3 top-4 text-gray-500" id="refIconRight"></i>
            <i class="fas fa-gift absolute left-3 top-4 text-gray-500 hidden" id="refIconLeft"></i>
        </div>

        <button onclick="register()" class="w-full bg-[#26A17B] py-3 rounded-lg font-bold text-white hover:bg-[#1e8565] transition transform active:scale-95" data-i18n="btnReg">تفعيل الحساب الآن</button>

        <p class="text-center mt-6 text-gray-400 text-sm">
            <span data-i18n="haveAccount">لديك حساب بالفعل؟</span>
            <a class='text-[#38bdf8] hover:underline' data-i18n='loginLink' href='/'>سجل دخولك</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // --------- نظام الترجمة الاحترافي ---------
        const translations = {
            ar: {
                pageTitle: "إنشاء حساب احترافي - Flash USDT",
                mainHeading: "إنشاء حساب جديد",
                subHeading: "انضم لأكبر منصة لتداول الفلاش USDT",
                fnamePh: "الاسم الأول",
                lnamePh: "اللقب",
                userPh: "اسم المستخدم",
                emailPh: "البريد الإلكتروني",
                passPh: "كلمة المرور",
                refPh: "كود الإحالة (اختياري)",
                btnReg: "تفعيل الحساب الآن",
                haveAccount: "لديك حساب بالفعل؟",
                loginLink: "سجل دخولك",
                errEmpty: "يرجى ملء جميع الخانات الأساسية!",
                regSuccess: "تم إنشاء الحساب بنجاح! جاري تحويلك..."
            },
            en: {
                pageTitle: "Create Account - Flash USDT",
                mainHeading: "Create New Account",
                subHeading: "Join the largest Flash USDT trading platform",
                fnamePh: "First Name",
                lnamePh: "Last Name",
                userPh: "Username",
                emailPh: "Email Address",
                passPh: "Password",
                refPh: "Referral Code (Optional)",
                btnReg: "Activate Account Now",
                haveAccount: "Already have an account?",
                loginLink: "Log in",
                errEmpty: "Please fill in all required fields!",
                regSuccess: "Account created successfully! Redirecting..."
            }
        };

        let currentLang = 'ar';

        function toggleLangMenu() {
            document.getElementById('langDropdown').classList.toggle('hidden');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.lang-container')) {
                const dropdown = document.getElementById('langDropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            const html = document.documentElement;
            if (lang === 'en') {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
                document.body.style.textAlign = 'left';
                document.getElementById('refIconRight').classList.add('hidden');
                document.getElementById('refIconLeft').classList.remove('hidden');
            } else {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
                document.body.style.textAlign = 'right';
                document.getElementById('refIconRight').classList.remove('hidden');
                document.getElementById('refIconLeft').classList.add('hidden');
            }

            document.title = translations[lang].pageTitle;

            // تحديث النصوص العادية
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });

            // تحديث الـ Placeholders لخانات الإدخال
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });

            document.getElementById('langDropdown').classList.add('hidden');
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('site_lang') || 'ar';
            setLanguage(savedLang);
        };

        // --------- منطق الصفحة وإضافة الإحالة ---------

        // تعبئة الخانة تلقائياً إذا وُجد الكود في الرابط[cite: 6]
        const urlParams = new URLSearchParams(window.location.search);
        const refCodeFromUrl = urlParams.get('ref');
        if (refCodeFromUrl) {
            document.getElementById('refInput').value = refCodeFromUrl;
        }

        function register() {
            const fname = document.getElementById('fname').value;
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const refCode = document.getElementById('refInput').value;

            if (!fname || !user || !pass) {
                alert(translations[currentLang].errEmpty);
                return;
            }

            const userData = {
                fname: fname,
                pass: pass
            };
            localStorage.setItem('user_' + user, JSON.stringify(userData));

            // --- نظام مكافآت الإحالة (10 فلاش للتسجيل) ---[cite: 6]
            if (refCode && refCode !== user) {
                let refStats = JSON.parse(localStorage.getItem('ref_stats_' + refCode)) || {
                    count: 0,
                    earnings: 0
                };

                refStats.count += 1;
                refStats.earnings += 10;
                localStorage.setItem('ref_stats_' + refCode, JSON.stringify(refStats));

                // حفظ اسم الداعي للعمولة (30%) عند الشراء لاحقاً[cite: 6]
                localStorage.setItem('referred_by_' + user, refCode);
            }

            localStorage.setItem('current_session', user);
            localStorage.setItem('active_name', fname);

            alert(translations[currentLang].regSuccess);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>

</html>
