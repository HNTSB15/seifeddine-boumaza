<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://cryptologos.cc/logos/tether-usdt-logo.png">
    <title>تسجيل الدخول - Flash USDT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #0b0e11;
            color: #eaecef;
            font-family: 'Segoe UI', sans-serif;
        }

        .input-style {
            background: #161a1e;
            border: 1px solid #333;
            color: white;
            transition: 0.3s;
        }

        .input-style:focus {
            border-color: #26A17B;
            outline: none;
        }

        /* تثبيت القائمة في الزاوية العلوية بشكل لا يتأثر باتجاه الصفحة */

        .lang-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        [dir="ltr"] .lang-container {
            left: auto;
            right: 20px;
        }
    </style>
</head>

<body class="flex items-center justify-center h-screen relative">

    <!-- زر تبديل اللغة الاحترافي -->
    <div class="lang-container">
        <div class="relative inline-block text-left">
            <button onclick="toggleLangMenu()" class="flex items-center justify-center w-10 h-10 rounded-full bg-[#1e2329] border border-gray-700 text-gray-400 hover:text-white hover:border-[#26A17B] transition shadow-lg focus:outline-none">
                <i class="fas fa-globe text-lg"></i>
            </button>

            <div id="langDropdown" class="hidden absolute top-12 left-0 mt-2 w-32 rounded-xl shadow-lg bg-[#1e2329] border border-gray-700 ring-1 ring-black ring-opacity-5 focus:outline-none">
                <div class="py-2">
                    <button onclick="setLanguage('ar')" class="text-gray-300 hover:bg-[#2b3139] hover:text-[#26A17B] flex items-center justify-between w-full px-4 py-2 text-sm transition">
                        العربية <span>🇸🇦</span>
                    </button>
                    <button onclick="setLanguage('en')" class="text-gray-300 hover:bg-[#2b3139] hover:text-[#26A17B] flex items-center justify-between w-full px-4 py-2 text-sm transition">
                        English <span>🇺🇸</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- محتوى صفحة تسجيل الدخول -->
    <div class="bg-[#1e2329] p-8 rounded-2xl border border-gray-800 w-full max-w-sm shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" width="50" class="mx-auto mb-4">
            <h2 id="headingText" class="text-2xl font-bold text-[#26A17B]">تسجيل الدخول</h2>
        </div>

        <input type="text" id="user" placeholder="اسم المستخدم" class="input-style p-3 rounded-lg w-full mb-4">
        <input type="password" id="pass" placeholder="كلمة المرور" class="input-style p-3 rounded-lg w-full mb-6">

        <button id="loginBtn" onclick="login()" class="w-full bg-[#26A17B] py-3 rounded-lg font-bold text-white hover:bg-[#1e8565] transition">دخول للمنصة</button>

        <p class="text-center mt-6 text-gray-400 text-sm">
            <span id="noAccountText">ليس لديك حساب؟</span>
            <a class='text-[#38bdf8]' href='register.html' id='registerLink'>إنشاء حساب جديد</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // قاموس الترجمة
        const translations = {
            ar: {
                pageTitle: "تسجيل الدخول - Flash USDT",
                heading: "تسجيل الدخول",
                userPlaceholder: "اسم المستخدم",
                passPlaceholder: "كلمة المرور",
                loginBtn: "دخول للمنصة",
                noAccount: "ليس لديك حساب؟",
                registerLink: "إنشاء حساب جديد",
                errPass: "كلمة المرور غير صحيحة!",
                errUser: "اسم المستخدم غير موجود، يرجى التسجيل أولاً."
            },
            en: {
                pageTitle: "Login - Flash USDT",
                heading: "Login",
                userPlaceholder: "Username",
                passPlaceholder: "Password",
                loginBtn: "Login to Platform",
                noAccount: "Don't have an account?",
                registerLink: "Create new account",
                errPass: "Incorrect password!",
                errUser: "Username not found, please register first."
            }
        };

        let currentLang = 'ar';

        // دالة إظهار/إخفاء قائمة اللغات
        function toggleLangMenu() {
            const dropdown = document.getElementById('langDropdown');
            dropdown.classList.toggle('hidden');
        }

        // إغلاق القائمة عند النقر خارجها
        window.onclick = function(event) {
            if (!event.target.closest('.lang-container')) {
                const dropdown = document.getElementById('langDropdown');
                if (!dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }

        // دالة تعيين اللغة وتطبيق الترجمة
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            const html = document.documentElement;

            // تغيير اتجاه الصفحة
            if (lang === 'en') {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
                document.body.style.textAlign = 'left';
            } else {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
                document.body.style.textAlign = 'right';
            }

            // تطبيق الترجمة على النصوص
            document.title = translations[lang].pageTitle;
            document.getElementById('headingText').innerText = translations[lang].heading;
            document.getElementById('user').placeholder = translations[lang].userPlaceholder;
            document.getElementById('pass').placeholder = translations[lang].passPlaceholder;
            document.getElementById('loginBtn').innerText = translations[lang].loginBtn;
            document.getElementById('noAccountText').innerText = translations[lang].noAccount;
            document.getElementById('registerLink').innerText = translations[lang].registerLink;

            // إخفاء القائمة بعد الاختيار
            document.getElementById('langDropdown').classList.add('hidden');
        }

        // استرجاع اللغة المحفوظة عند فتح الصفحة
        window.onload = () => {
            const savedLang = localStorage.getItem('site_lang') || 'ar';
            setLanguage(savedLang);
        };

        // دالة تسجيل الدخول (محدثة لدعم الترجمة في رسائل التنبيه)
        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;

            const data = localStorage.getItem('user_' + u);

            if (data) {
                const userObj = JSON.parse(data);
                if (userObj.pass === p) {
                    localStorage.setItem('current_session', u);
                    localStorage.setItem('active_name', userObj.fname);
                    window.location.href = 'dashboard.html';
                } else {
                    alert(translations[currentLang].errPass);
                }
            } else {
                alert(translations[currentLang].errUser);
            }
        }
    </script>
</body>

</html>
